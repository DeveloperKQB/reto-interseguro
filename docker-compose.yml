services:
  api-node:
    build: ./api-node
    # Sin "ports": servicio interno, solo accesible desde la red de Docker
    environment:
      - JWT_SECRET=${JWT_SECRET}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  api-go:
    build: ./api-go
    ports:
      - "8080:8080"
    environment:
      - STATS_API_URL=http://api-node:3000
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_USERNAME=${AUTH_USERNAME}
      - AUTH_PASSWORD=${AUTH_PASSWORD}
    depends_on:
      api-node:
        condition: service_healthy

    frontend:
    build: ./frontend
    ports:
      - "8081:8080"
    depends_on:
      - api-go