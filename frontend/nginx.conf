# Sirve el frontend estático y redirige /api/ al contenedor de Go.
# Al compartir origen, el navegador no necesita CORS.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Cabeceras de seguridad. La CSP solo permite scripts y estilos propios:
    # por eso JS y CSS van en archivos separados, sin código inline.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    server_tokens off;

    location /api/ {
        proxy_pass http://api-go:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}